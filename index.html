<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Homework</title>
    <style>
        h1 {
            display: block;
            margin: 0 auto;
            text-align: center;
            color: rgb(39, 32, 38);
            font-family: Helvetica, Arial, sans-serif;
            font-size: 34px;
            font-weight: 900;
            line-height: 48px;
            padding-top: 100px;
        }

        h2 {
            display: block;
            text-align: center;
            margin: 0 auto;
            color: #8064e9;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 34px;
            font-weight: 900;
            line-height: 48px;
            padding-bottom: 24px;
        }

        p {
            display: block;
            margin: 18px 0;
            text-align: center;
            color: rgb(39, 32, 38);
            font-family: monospace;
            line-height: 28px;
            font-size: 18px;
        }

        button {
            border-radius: 25px;
            border: 1px solid #8064e9;
            background: #8064e9;
            color: #fff;
            font-size: 16px;
            line-height: 22px;
            padding: 16px 24px;
            text-decoration: none;
            transition: all 200ms ease;
            box-shadow: 7 5 12 rgb(0, 0, 0.1);
            border: 0px 8px 8px 0;
            padding: 16px 24px;
            text-decoration: none;
        }

        button:hover {
            cursor: pointer;
            background-color: #5E41A7;
            transition: all 200ms ease;
        }
    </style>
</head>

<body>
    <h1>
        👩‍💻SheCodes is a Coding Workshop for Women
    </h1>
    <h2>
        Access a new career in Technology
    </h2>
    <p>
        SheCodes teaches coding, design and management skills to women
        <br>
        <strong>
            Limited number of spots available!
        </strong>
        <br>
        <br>
        <button>
            Join now
        </button>
    </p>
</body>

</html>
